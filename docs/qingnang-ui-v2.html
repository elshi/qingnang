<body><main class="sheet"><div class="sheet-head"><h1>青囊经典 · 页面视觉设计稿</h1><small>V2 / 微信小程序 / 390 × 844 / 12 个页面</small></div><div class="grid" id="grid"></div></main>
<script>
const assets='../miniprogram/assets/';
const nav=(title,action='⌕')=>`<div class="top"><span class="back">‹</span><strong class="title">${title}</strong><span class="top-action">${action}</span></div>`;
const search=(hint)=>`<div class="search"><b>⌕</b><span>${hint}</span></div>`;
const tabbar=(sel='首页')=>`<div class="tabbar">${[['⌂','首页'],['♡','收藏'],['▤','笔记'],['♙','我的']].map(([icon,label])=>`<div class="${label===sel?'sel':''}"><b>${icon}</b>${label}</div>`).join('')}</div>`;
const frame=(key,label,content)=>`<section class="frame" data-key="${key}"><div class="frame-label">${label}</div><div class="phone"><div class="screen">${content}</div></div></section>`;
const screens=[];
screens.push(frame('home','01 / 首页 · 以学习路径为中心',`<div class="hero-home"><div class="eyebrow">QING NANG CLASSICS</div><div class="brand">青囊经典 <span class="seal">青囊<br>经典</span></div><p>读经典 · 识医理 · 循经脉</p><span class="sprig">竹</span></div><div class="search home-search"><b>⌕</b>搜索医案、医书、方剂、穴位</div><div class="home-intro"><div class="heading">从经典里，读懂中医</div><p>四种路径，找到你想学的内容</p></div><div class="entry-grid"><div class="entry"><h3>经典医案</h3><p>看名家辨证施治</p><span class="num">案</span></div><div class="entry"><h3>经典医书</h3><p>读医家传世著作</p><span class="num">书</span></div><div class="entry"><h3>经典处方</h3><p>解历代方剂配伍</p><span class="num">方</span></div><div class="entry"><h3>经络穴位</h3><p>识奇经循行与腧穴</p><span class="num">脉</span></div></div><div class="continue"><div><small>继续阅读 · 伤寒论</small><b>辨太阳病脉证并治</b></div><span class="round">继续读 →</span></div><div class="daily"><div class="section-row"><strong>今日一读</strong><small>每日一则</small></div><div class="quote">“上工治未病，不治已病，此之谓也。”</div><div class="src">《黄帝内经·素问》</div></div>${tabbar()}`));
screens.push(frame('cases','02 / 经典医案 · 全部',`${nav('经典医案')}<div class="pad"><div class="tabs"><span class="active">全部</span><span>医家</span><span>出处</span></div><div style="height:17px"></div>${search('搜索医家、病证、症状')}<div class="section-row"><strong>医案选读</strong><small>按医家与病证浏览</small></div><div class="case-card"><h3>张仲景 · 太阳中风</h3><span class="chip">发热恶寒</span><span class="chip">头痛身痛</span><span class="chip">脉浮缓</span><p>太阳中风，发热恶寒，头痛身痛。审其营卫，辨其表里。</p><small>出处：《伤寒论》　→</small></div><div class="case-card"><h3>叶天士 · 温热病咳嗽</h3><span class="chip">咳嗽痰黏</span><span class="chip">口渴</span><p>温邪上受，首先犯肺；辨卫气营血，察热邪传变。</p><small>出处：《叶天士医案》　→</small></div><div class="case-card"><h3>薛生白 · 湿热泄泻</h3><span class="chip">泄泻腹痛</span><span class="chip">身热不扬</span><p>湿热下迫，脾失健运。详察舌苔、脉象与轻重缓急。</p><small>出处：《湿热条辨》　→</small></div></div>${tabbar()}`));
screens.push(frame('case-detail','03 / 医案详情 · 原文与解析',`${nav('医案详情','♡')}<div class="tabs pad"><span class="active">原文</span><span>辨证解析</span></div><div class="case-title"><div class="eyebrow">CLASSIC CASE</div><h1>张仲景 · 太阳中风</h1><p>《伤寒论》 · 东汉 · 张仲景</p><span class="chip">发热恶寒</span><span class="chip">脉浮缓</span></div><div class="article-section"><h3>原始症状</h3><p>发热、汗出、恶风，脉浮缓。辨其营卫不和，病在太阳之表。</p></div><div class="article-section"><h3>医案原文</h3><p class="original">太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自出。啬啬恶寒，淅淅恶风，翕翕发热。</p></div><div class="article-section"><h3>阅读提示</h3><p>先读症状与脉象，再对照“辨证解析”理解治法和方药。</p></div><div class="pad bottom-note" style="padding-top:18px">古籍内容供中医文化学习与学术研究参考。</div><div class="dock"><span>原文</span><strong>查看辨证解析 →</strong><span>收藏 ♡</span></div>`));

screens.push(frame('reader','05 / 医书阅读 · 沉浸式排版',`<div class="reader">${nav('黄帝内经','⋯')}<div class="reader-progress"><i></i></div><div class="reader-body"><div class="bookline">素问 · 第一篇</div><h1>上古天真论</h1><p>昔在黄帝，生而神灵，弱而能言，幼而徇齐，长而敦敏，成而登天。</p><p>乃问于天师曰：余闻上古之人，春秋皆度百岁，而动作不衰；今时之人，年半百而动作皆衰者，时世异耶？人将失之耶？</p><p>岐伯对曰：上古之人，其知道者，法于阴阳，和于术数，食饮有节，起居有常，不妄作劳，故能形与神俱。</p><p>而尽终其天年，度百岁乃去。</p><div class="micro" style="text-align:center;margin-top:25px">— 1 / 162 —</div></div><div class="dock"><span>☷ 目录</span><span>‹ 上一篇</span><strong>下一篇 ›</strong><span>释义</span><span>Aa 设置</span></div></div>`));
